<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RASA RUSH v2</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2d1b12; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Dibacakan, tidak ditampilkan: garis status yang diumumkan pembaca layar. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  /* Tombol sentuh di bawah canvas: aksi, upgrade, jeda. */
  #touchbar {
    position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%);
    display: flex; gap: 10px; z-index: 5;
  }
  #touchbar button {
    font: bold 15px system-ui, sans-serif; color: #fff;
    background: rgba(78, 52, 46, 0.92); border: 2px solid #ffcc80;
    border-radius: 12px; padding: 10px 18px; cursor: pointer;
  }
  #touchbar button:active { background: #e65100; }
</style>
</head>
<body>
<canvas id="game" aria-label="Rasa Rush v2: game memasak. Gerakkan koki, potong dan masak bahan, rakit hidangan, dan sajikan sebelum pelanggan kabur. 8 resep, 3 kesulitan, mode Endless, upgrade, pelanggan VIP."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<div id="touchbar">
  <button id="btn-interact">AKSI (E)</button>
  <button id="btn-upgrade">UPGRADE (U)</button>
  <button id="btn-pause">JEDA (P)</button>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
